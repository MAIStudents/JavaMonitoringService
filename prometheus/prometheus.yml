global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'java-internal-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['java-service-filtering:8082', 'java-service-deduplication:8083', 'java-service-enrichment:8085']
        labels:
          group: 'java-internal-services'
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['java-service-management:8081', 'java-bff-service:8084']
        labels:
          group: 'spring-services'