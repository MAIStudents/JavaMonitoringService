global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-info'
    metrics_path: '/actuator/info'
    static_configs:
      - targets:
          - 'java-service-management:8081'
  - job_name: 'spring-metrics'
    metrics_path: '/actuator/metrics'
    static_configs:
      - targets:
          - 'java-service-management:8081'