services:
  java-service-bff:
    build:
      context: ./java-service-bff
    env_file: ./java-service-bff/java-service-bff.env
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - redis
      - mongodb
      - postgres

  java-service-deduplication:
    build:
      context: ./java-service-deduplication
    env_file: ./java-service-deduplication/java-service-deduplication.env
#    ports:
#      - "8081:8080"
    depends_on:
      - kafka
      - redis
      - postgres

  java-service-enrichment:
    build:
      context: ./java-service-enrichment
    env_file: ./java-service-enrichment/java-service-enrichment.env
#    ports:
#      - "8082:8080"
    depends_on:
      - kafka
      - mongodb
      - postgres

  java-service-filtering:
    build:
      context: ./java-service-filtering
    env_file: ./java-service-filtering/java-service-filtering.env
#    ports:
#      - "8083:8080"
    depends_on:
      - kafka
      - postgres

  java-service-management:
    build:
      context: ./java-service-management
    env_file: ./java-service-management/java-service-management.env
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - redis
      - mongodb
      - postgres

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monitoringdb
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      - prometheus
